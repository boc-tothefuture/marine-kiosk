[project]
name = "marine-kiosk"
version = "0.1.4"
description = "A glanceable digital marine kiosk dashboard for TVs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "noaa-coops>=0.3.1",
    "pandas>=2.0.0",
    "astral>=3.2",
    "requests>=2.31.0",
]

[project.scripts]
marine-kiosk = "marine_kiosk.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 120

